[package]
name = "eve-suite"
version = "0.0.0"
description = "EVE Online 单机桌面工具套件"
authors = ["q956720465"]
edition = "2021"
# 实际最低版本由依赖决定：reqwest 0.13.x 需 rustc >= 1.85
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "eve_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
# 桌面通知（P5-7）：系统通知 / 托盘弹窗，Windows 走 WinRT Toast
tauri-plugin-notification = "2"
# 数据库：自管 sqlx SQLite 连接池（原 tauri-plugin-sql 的 JS API 无事务能力，已退役）
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
# SDE 下载与解压（P1）：reqwest 走 rustls 免系统 OpenSSL 依赖；zip 仅需 deflate
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3.34"
zip = { version = "4", default-features = false, features = ["deflate"] }
# net/time：P3-1 OAuth 本地回环监听（TcpListener）与回调超时
tokio = { version = "1.53.1", features = ["fs", "io-util", "sync", "net", "time"] }
# 系统钥匙串（P3-2）：OAuth 刷新令牌等机密存平台安全存储，数据库不落明文。
# 平台后端各自独立依赖（Windows Credential Manager / macOS Keychain / Linux Secret Service），
# 同一平台只允许启用一个后端——启用多个会静默回落 mock 存储。
keyring = { version = "3.4", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }

[dev-dependencies]
# 仅测试用：#[tokio::test] 需要宏与多线程运行时
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
