# P0-4：三平台安装包构建（windows / macos / ubuntu）
# - push 到 main：跑 core 单测 + 产出构建 artifact（Artifacts 页可下载）
# - push tag v*：三平台构建完成后，统一发布到 GitHub Release（含更新器所需的 .sig 与 latest.json）
# - 约定：CI 为境外机器，构建前移除 .cargo/config.toml 与 .npmrc（国内镜像配置），直连官方源
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # release job 创建/更新 Release 所需

env:
  # 仅 tag 构建启用更新器产物（createUpdaterArtifacts + 签名）；日常 push 不引入签名依赖，
  # 因此未配置 TAURI_SIGNING_PRIVATE_KEY 也不会让日常构建变红。
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
          # macOS 出 **universal** 包：一个 dmg 同时覆盖 Apple Silicon 与 Intel。
          # 背景：macos-13 已于 2025-12-04 退役；Apple 已停止支持 x86_64，
          # GitHub 也将在 macOS 15 镜像退役（2027 秋）后不再提供 Intel runner。
          - name: macos-universal
            os: macos-latest
            args: '--target universal-apple-darwin'
          - name: linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # 版本读根 package.json 的 packageManager 字段

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # core 的离线测试依赖内建 node:sqlite（需 ≥22.5）；与本地环境和 README 保持一致用 24
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.name == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux system dependencies (webkit2gtk etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Remove local mirror configs (CI uses official registries)
        shell: bash
        run: rm -f .cargo/config.toml .npmrc

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core tests
        run: pnpm --filter @eve-suite/core test

      - name: Build installers
        env:
          # tag 构建需要它来签名（缺 Secret 时为空 → 仅 tag 构建会失败，日常构建不受影响）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        # 表达式：仅 tag 构建合并更新器配置（开启 createUpdaterArtifacts）
        run: pnpm tauri build ${{ matrix.args }} ${{ env.IS_RELEASE == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eve-suite-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/universal-apple-darwin/release/bundle/**/*

  release:
    name: release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate latest.json (updater manifest)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/build-latest-json.mjs \
            --bundle artifacts \
            --version "$VERSION" \
            --base-url "${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}" \
            --notes "详见本次 GitHub Release 说明" \
            --out artifacts/latest.json

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
